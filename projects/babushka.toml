[info]
description = "Call DAG viewer for code navigation. Start with cargo-call-stack gap analysis."
repo_link   = ""
tags        = ["AST", "Static Analysis", "DAG", "Code Quality", "Comptime Checks"]
builds_on   = []

# Scores are integers [1, 10]. Higher always means more of that thing.
# Uncomment and fill; an unscored project cannot be ranked.
[attributes]
research_topic = 4 # in my realm of research interest
research_skill = 3 # develops research skills I want
research_value = 2 # how valuable is this research work
code_topic     = 5 # in my realm of technical interest
code_skill     = 5 # develops coding skills I want
code_value     = 8 # how valuable is this code tool
boundedness    = 6 # how well-scoped
quick_v1       = 5 # how fast to first working version
low_upkeep     = 7 # how easy to maintain once working
eagerness      = 5 # how excited am I to work on it
