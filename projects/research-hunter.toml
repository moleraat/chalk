[info]
description = "Cron scraper to weekly report on relevant research and OSS. Collect reoccuring relevant researchers and organizations."
repo_link   = ""
tags        = ["LLM", "Cron", "Task Organization"]
builds_on   = []

# Scores are integers [1, 10]. Higher always means more of that thing.
# Uncomment and fill; an unscored project cannot be ranked.
[attributes]
research_topic = 2 # in my realm of research interest
research_skill = 2 # develops research skills I want
research_value = 6 # how valuable is this research work
code_topic     = 2 # in my realm of technical interest
code_skill     = 2 # develops coding skills I want
code_value     = 6 # how valuable is this code tool
boundedness    = 9 # how well-scoped
quick_v1       = 8 # how fast to first working version
low_upkeep     = 8 # how easy to maintain once working
eagerness      = 7 # how excited am I to work on it
