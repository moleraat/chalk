[info]
description = "Groups project ideas, uses my input and repo history to suggest things to work on for the week"
repo_link   = "https://github.com/moleraat/chalk"
tags        = ["LLM", "Parser", "Task Organization", "Cron"]
builds_on   = []

# Scores are integers [1, 10]. Higher always means more of that thing.
# Uncomment and fill; an unscored project cannot be ranked.
[attributes]
research_topic = 1 # in my realm of research interest
research_skill = 3 # develops research skills I want
research_value = 5 # how valuable is this research work
code_topic     = 4 # in my realm of technical interest
code_skill     = 5 # develops coding skills I want
code_value     = 6 # how valuable is this code tool
boundedness    = 9 # how well-scoped
quick_v1       = 9 # how fast to first working version
low_upkeep     = 8 # how easy to maintain once working
eagerness      = 5 # how excited am I to work on it
