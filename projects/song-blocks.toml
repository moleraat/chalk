# Scores are integers [1, 10]. Higher always means more of that thing.
# Uncomment and fill; an unscored project cannot be ranked.
[attributes]
research_topic = 2 # in my realm of research interest
research_skill = 2 # develops research skills I want
research_value = 2 # how valuable is this research work
code_topic     = 7 # in my realm of technical interest
code_skill     = 7 # develops coding skills I want
code_value     = 5 # how valuable is this code tool
boundedness    = 7 # how well-scoped
quick_v1       = 6 # how fast to first working version
low_upkeep     = 6 # how easy to maintain once working
eagerness      = 8 # how excited am I to work on it
